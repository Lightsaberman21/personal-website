<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="weather-card">
        <div class="search-box">
            <input type="text" id="city-input" placeholder="Enter city name..." autocomplete="off">
            <button id="search-btn">Search</button>
        </div>

        <div id="weather-info" class="weather-info hidden">
            <h2 id="city-name">London, GB</h2>
            <p id="weather-desc">Clear Sky</p>
            <div class="temp-display">
                <span id="temprature">15</span>°C
            </div>
            <div class="details">
                <div class="detail-item">
                    <span>Humidity</span>
                    <strong id="humidity">60%</strong>
                </div>
                <div class="detail-item">
                    <span>Wind Speed</span>
                    <strong id="wind-speed">5 m/s</strong>
                </div>
            </div>
        </div>

        <div id="error-message" class="error-message hidden">
            City not found. Please try again.
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
