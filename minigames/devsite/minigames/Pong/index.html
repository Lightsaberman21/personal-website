<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pong</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <a href="../../minigames/">
        <button id="btn">Return</button>
    </a>
    <div class="game-container">
        <div class="score-board">
            <span id="player1-score">0</span>
            <span id="player2-score">0</span>
        </div>

        <canvas id="pongCanvas" width="800" height="500"></canvas>
        <div class="instructions">P1: Press <strong>W</strong> for up and <strong>S</strong> for down</div>
        <div class="instructions">P2: Press <strong>Up Arrow</strong> for up and <strong>Down Arrow</strong> for down</div>
    </div>
    <script src="script.js"></script>
</body>
</html>
